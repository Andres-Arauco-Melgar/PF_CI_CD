<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Proyecto CI/CD</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1f2937, #111827);
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 20px;
      }

      .card {
        background: #ffffff;
        border-radius: 18px;
        padding: 40px 30px;
        max-width: 500px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        border-top: 6px solid #6366f1;
      }

      .badge {
        display: inline-block;
        background: #eef2ff;
        color: #4338ca;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
        padding: 6px 12px;
        border-radius: 999px;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      h1 {
        font-size: 28px;
        color: #1e293b;
        margin-bottom: 10px;
      }

      .autor {
        color: #64748b;
        font-size: 15px;
        margin-bottom: 25px;
      }

      .autor strong {
        color: #6366f1;
      }

      h2 {
        font-size: 22px;
        color: #0ea5e9;
        margin-bottom: 12px;
      }

      p {
        color: #475569;
        font-size: 15px;
        line-height: 1.6;
      }

      .nota {
        margin-top: 22px;
        font-size: 13px;
        color: #94a3b8;
        font-style: italic;
        border-top: 1px dashed #cbd5e1;
        padding-top: 14px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Pipeline activo</span>

      <h1>Prueba con CI/CD</h1>
      <p class="autor">Hecho por <strong>Andres Arauco Melgar</strong></p>

      <h2>¡CI/CD!</h2>
      <p>Este proyecto se ha desplegado automáticamente usando CI/CD.</p>

      <p class="nota">Corrección en fase final ✔
  </body>
</html>
